<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>地下迷宫 · 从家出发</title>
  <link rel="stylesheet" href="style.css?v=overhead">
  <script src="game.js?v=overhead" defer></script>
</head>
<body>
  <main>
    <header>
      <div><h1>地下迷宫</h1></div>
      <button type="button" id="reset">重新开始</button>
    </header>
    <p class="instructions">从上方入口走到下方出口。点同一条直道上的空地，转弯后再点下一段。</p>
    <svg id="map" role="group" tabindex="0" aria-label="完整的俯视迷宫。可用方向键移动。"></svg>
    <p id="status" role="status">入口在左上，出口在右下。也可以用方向键移动。</p>
  </main>
</body>
</html>
