<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>地下迷宫 · 从家出发</title>
  <link rel="stylesheet" href="style.css?v=loops">
  <script src="game.js?v=loops" defer></script>
</head>
<body>
  <main>
    <header>
      <div><h1>地下迷宫</h1></div>
      <button type="button" id="reset">重新开始</button>
    </header>
    <p class="instructions">点浅绿色通道前进，或按方向按钮走一步。</p>
    <svg id="map" role="group" tabindex="0" aria-label="完整的俯视迷宫。可用方向键移动。"></svg>
    <div class="directions" role="group" aria-label="移动方向">
      <button type="button" data-direction="ArrowLeft" aria-label="向左">←</button>
      <button type="button" data-direction="ArrowUp" aria-label="向上">↑</button>
      <button type="button" data-direction="ArrowDown" aria-label="向下">↓</button>
      <button type="button" data-direction="ArrowRight" aria-label="向右">→</button>
    </div>
    <p id="status" role="status">从左上角入口先往下走。</p>
  </main>
</body>
</html>
