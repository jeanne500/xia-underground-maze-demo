<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>鹦鹉走绳索 · 从家出发</title>
  <link rel="stylesheet" href="style.css?v=gentle-tilt">
  <script src="game.js?v=gentle-tilt" defer></script>
</head>
<body>
<main>
  <header><a href="../">‹ 地下迷宫</a><h1>陪鹦鹉走绳索</h1></header>
  <svg id="scene" viewBox="0 0 280 500" aria-label="从上方俯看钢丝。鹦鹉从画面下方走向上方的水碗。" role="img">
    <rect width="280" height="500" rx="15" fill="#eee0c3"/>
    <path d="M0 87H280M0 166H280M0 245H280M0 324H280M0 403H280" stroke="#d9c29d" stroke-width="2"/>
    <rect x="67" y="28" width="146" height="444" rx="70" fill="#d0dac3" stroke="#a9b69c" stroke-width="3"/>
    <path d="M82 83V412M198 83V412" stroke="#e4ebd6" stroke-width="2" stroke-dasharray="5 8"/>
    <path id="curtain" d="M232 32H261V135Q247 144 226 134Z" fill="#d8896e"/>
    <path id="rope" d="M140 431Q140 338 140 250Q140 159 140 69" fill="none" stroke="#69594e" stroke-width="4"/>
    <path d="M108 431H172M106 250H174M108 69H172" stroke="#986b43" stroke-width="12" stroke-linecap="round"/>
    <circle cx="140" cy="38" r="15" fill="#547e83" stroke="#a9d3d0" stroke-width="4"/>
    <path d="M132 38Q140 32 148 38" fill="none" stroke="#d3ede6" stroke-width="2"/>
    <g id="bird">
      <path d="M-6 5L-4 25L0 21L4 25L6 5" fill="#456c60"/>
      <ellipse rx="13" ry="19" fill="#65a76e"/>
      <g id="wing" fill="#38745f"><ellipse cx="-10" cy="2" rx="7" ry="13"/><ellipse cx="10" cy="2" rx="7" ry="13"/></g>
      <circle cy="-14" r="11" fill="#92ba70"/>
      <circle cx="-6" cy="-17" r="2" fill="#292a25"/><circle cx="6" cy="-17" r="2" fill="#292a25"/>
      <path d="M-4 -22Q0 -31 4 -22L0 -19Z" fill="#dc9a45"/>
    </g>
    <text id="arrow" x="208" y="240" text-anchor="middle"></text>
  </svg>
  <p id="progress">客厅 · 窗边</p>
  <p id="status" role="status">鹦鹉站在窗边。要陪它走到水碗旁吗？</p>
  <div id="actions" class="actions"></div>
  <p id="sensor">姿态感应：等待开启</p>
  <details><summary>操作提示</summary><p>手机竖屏、屏幕朝上，像端小托盘。放平时停下。轻压手机顶端就往前走。鹦鹉往左歪就向右倾，扶正后把手机左右摆平，再向前倾。</p></details>
</main>
</body>
</html>
